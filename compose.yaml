name: releaselog

x-app-build: &app-build
  context: .
  target: runner
  args:
    NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    NEXT_PUBLIC_USE_SERVER_DATA: ${NEXT_PUBLIC_USE_SERVER_DATA:-1}
    NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    NEXT_PUBLIC_ADSENSE_ID: ${NEXT_PUBLIC_ADSENSE_ID:-}

x-app-env: &app-env
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  PORT: "3000"
  HOSTNAME: 0.0.0.0
  DATABASE_URL: postgres://${POSTGRES_USER:-releaselog}:${POSTGRES_PASSWORD:-releaselog}@db:5432/${POSTGRES_DB:-releaselog}
  NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
  NEXT_PUBLIC_USE_SERVER_DATA: ${NEXT_PUBLIC_USE_SERVER_DATA:-1}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-releaselog}
      POSTGRES_USER: ${POSTGRES_USER:-releaselog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-releaselog}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: *app-build
    image: releaselog-app:${RELEASELOG_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
