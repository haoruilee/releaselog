services:
  app:
    build:
      context: .
      target: dev
    image: releaselog-app:dev
    command: npm run dev:docker
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-releaselog}:${POSTGRES_PASSWORD:-releaselog}@db:5432/${POSTGRES_DB:-releaselog}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3001}
      NEXT_PUBLIC_USE_SERVER_DATA: ${NEXT_PUBLIC_USE_SERVER_DATA:-1}
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3000"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - next-cache:/app/.next

volumes:
  node-modules:
  next-cache:
